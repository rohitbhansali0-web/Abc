<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Setu Darshan</title><style>
:root{--bg:#241218;--panel:#2e1820;--soft:#3a2029;--ivory:#f4eedf;--muted:#b8ad9c;--gold:#c9a227;--green:#4c7a5a;--red:#a8322d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ivory);font:15px system-ui,sans-serif}main{max-width:520px;margin:auto;padding:28px 16px 60px}.mono{font:11px ui-monospace,monospace;letter-spacing:.12em}.display{font-family:Georgia,serif}.panel{background:var(--panel);border:1px solid #ffffff14;border-radius:18px;padding:18px}.input,.select,button{width:100%;border:0;border-radius:12px;padding:13px;margin-top:8px;font:inherit}.input,.select{background:var(--soft);color:var(--ivory)}button{background:var(--gold);color:#2a1a1b;font-weight:700;cursor:pointer}.muted{color:var(--muted);font-size:13px}.grid{display:grid;gap:10px}.gold{color:var(--gold)}.hidden{display:none}.card{background:var(--ivory);color:#2a1a1b;border-radius:18px;padding:18px;margin-top:12px}.row{display:flex;justify-content:space-between;gap:12px}.tag{font:10px ui-monospace,monospace;padding:5px 8px;border-radius:99px;background:#4c7a5a22;color:var(--green)}a{color:var(--gold)}</style></head>
<body><main>
<div class="mono gold">VERIFIED DARSHAN PASSES</div><h1 class="display" style="font-size:38px;margin:6px 0 22px">Setu</h1>
<div id="app"></div>
</main><script>
const $=s=>document.querySelector(s);let session=localStorage.getItem("setu_session"),me=JSON.parse(localStorage.getItem("setu_me")||"null"),temples=[];
async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{"Content-Type":"application/json","x-setu-session":session||"",...(opt.headers||{})}});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||"Request failed");return j}
function render(){if(!me){$("#app").innerHTML=`<div class=panel><div class=mono class=gold>STEP 1</div><h2 class=display>Register & verify</h2><p class=muted>Enter your mobile number. A real OTP will be sent by SMS.</p><input id=name class=input placeholder="Full name"><input id=phone class=input placeholder="10-digit Indian mobile"><button onclick=startOtp>Send OTP</button><p id=msg class=muted></p><div id=otpbox class=hidden><input id=otp class=input placeholder="6-digit OTP"><button onclick=verify>Verify & Continue</button></div></div>`;return}
$("#app").innerHTML=`<div class=panel><div class=mono gold>DEVOTEE</div><h2 class=display>Book Darshan</h2><p class=muted>Welcome, ${me.name}</p><div id=bookform></div></div><div id=list></div>`;
load();}
async function startOtp(){try{const name=$("#name").value.trim(),phone=$("#phone").value.trim();await api("/api/devotee/otp/start",{method:"POST",body:JSON.stringify({name,phone})});$("#otpbox").classList.remove("hidden");$("#msg").textContent="OTP sent. Check your SMS.";window._name=name;window._phone=phone}catch(e){$("#msg").textContent=e.message}}
async function verify(){try{const j=await api("/api/devotee/otp/verify",{method:"POST",body:JSON.stringify({name:window._name,phone:window._phone,code:$("#otp").value.trim()})});session=j.session;me=j.devotee;localStorage.setItem("setu_session",session);localStorage.setItem("setu_me",JSON.stringify(me));render()}catch(e){$("#msg").textContent=e.message}}
async function load(){const j=await api("/api/temples");temples=j.temples;$("#bookform").innerHTML=`<select id=t class=select onchange=slots()><option value="">Choose temple</option>${temples.map(t=>`<option value="${t.id}">${t.name} — ₹${t.price}</option>`).join("")}</select><div id=s></div><input id=d class=input type=date min="${j.dates[0]}" value="${j.dates[0]}"><input id=q class=input type=number min=1 max=10 value=1><button onclick=book>Confirm Booking</button>`;await list()}
function slots(){const t=temples.find(x=>x.id===$("#t").value);$("#s").innerHTML=t?`<select id=slot class=select>${t.slots.map(x=>`<option>${x}</option>`).join("")}</select>`:""}
async function book(){try{const j=await api("/api/devotee/bookings",{method:"POST",body:JSON.stringify({templeId:$("#t").value,date:$("#d").value,slot:$("#slot").value,qty:$("#q").value})});alert("Booking created: "+j.booking.id);list()}catch(e){alert(e.message)}}
async function list(){const j=await api("/api/devotee/bookings");$("#list").innerHTML=j.bookings.map(b=>`<div class=card><div class=row><b>${b.temple}</b><span class=tag>${b.status}</span></div><div>${b.city}</div><div class=muted>${b.date} · ${b.slot}</div><hr><b>${b.id}</b><div>₹${b.total} · ${b.qty} devotee(s)</div>${b.status==="PAID"||b.status==="USED"?`<p><a href="/api/counter/pass/${b.id}/qr">QR image</a> (counter-only link)</p>`:"<p class=muted>Pay offline at the temple counter to receive the pass.</p>"}</div>`).join("")}
render();
</script></body></html>
