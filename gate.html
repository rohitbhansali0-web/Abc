<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Setu Gate</title><script src="https://unpkg.com/html5-qrcode"></script><style>
body{margin:0;background:#241218;color:#f4eedf;font:15px system-ui}main{max-width:650px;margin:auto;padding:28px 16px}.panel{background:#2e1820;border-radius:18px;padding:18px;margin:12px 0}.input,button{width:100%;box-sizing:border-box;padding:13px;border-radius:12px;border:0;margin-top:8px}.input{background:#3a2029;color:#f4eedf}button{background:#c9a227;color:#2a1a1b;font-weight:700}.mono{font:11px ui-monospace,monospace}.gold{color:#c9a227}.ok{background:#4c7a5a22;padding:16px;border-radius:14px}.bad{background:#a8322d22;padding:16px;border-radius:14px}</style></head><body><main><div class=mono class=gold>GATE SECURITY</div><h1>Validate Entry</h1><div id=app></div></main><script>
const $=s=>document.querySelector(s);let session=localStorage.getItem("gate_session"),scanner;
async function api(u,o={}){const r=await fetch(u,{...o,headers:{"Content-Type":"application/json","x-setu-session":session||"",...(o.headers||{})}});const j=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(Error(j.error||"Request failed"),{data:j});return j}
function login(){app.innerHTML=`<div class=panel><input id=u class=input placeholder="Gate username"><input id=p class=input type=password placeholder="Gate password"><button onclick=doLogin>Login</button></div>`}
async function doLogin(){try{const j=await api("/api/gate/login",{method:"POST",body:JSON.stringify({username:u.value,password:p.value})});session=j.session;localStorage.setItem("gate_session",session);render()}catch(e){alert(e.message)}}
async function scan(payload){try{const j=await api("/api/gate/validate",{method:"POST",body:JSON.stringify({payload})});app.innerHTML+=`<div class=ok><h2>ENTRY GRANTED</h2><div>${j.booking.name} · ${j.booking.id}</div><div>${j.booking.temple}</div><p>${j.reason}</p></div>`}catch(e){app.innerHTML+=`<div class=bad><h2>ENTRY DENIED</h2><p>${e.message}</p></div>`}}
function render(){if(!session)return login();app.innerHTML=`<div class=panel><div id=reader></div><input id=manual class=input placeholder="Or paste QR payload"><button onclick="scan(manual.value)">Validate</button></div>`;scanner=new Html5Qrcode("reader");scanner.start({facingMode:"environment"},{fps:10,qrbox:{width:250,height:250}},text=>{scanner.stop();scan(text)}).catch(()=>{})}
render();
</script></body></html>
