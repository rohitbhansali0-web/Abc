<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Setu Counter</title><style>
body{margin:0;background:#241218;color:#f4eedf;font:15px system-ui}main{max-width:650px;margin:auto;padding:28px 16px}.panel,.card{background:#2e1820;border-radius:18px;padding:18px;margin:12px 0}.input,button{width:100%;box-sizing:border-box;padding:13px;border-radius:12px;border:0;margin-top:8px}.input{background:#3a2029;color:#f4eedf}button{background:#c9a227;color:#2a1a1b;font-weight:700}.muted{color:#b8ad9c;font-size:13px}.mono{font:11px ui-monospace,monospace}.gold{color:#c9a227}.green{color:#4c7a5a}</style></head><body><main><div class="mono gold">TEMPLE COUNTER</div><h1>Confirm Payment</h1><div id=app></div></main><script>
const $=s=>document.querySelector(s);let session=localStorage.getItem("counter_session");
async function api(u,o={}){const r=await fetch(u,{...o,headers:{"Content-Type":"application/json","x-setu-session":session||"",...(o.headers||{})}});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||"Request failed");return j}
function login(){app.innerHTML=`<div class=panel><input id=u class=input placeholder="Counter username"><input id=p class=input type=password placeholder="Counter password"><button onclick=doLogin>Login</button></div>`}
async function doLogin(){try{const j=await api("/api/counter/login",{method:"POST",body:JSON.stringify({username:u.value,password:p.value})});session=j.session;localStorage.setItem("counter_session",session);render()}catch(e){alert(e.message)}}
async function render(){if(!session)return login();app.innerHTML=`<div class=panel><input id=q class=input placeholder="Booking ID or mobile"><button onclick=search>Search</button></div><div id=list></div>`;search()}
async function search(){const j=await api("/api/counter/bookings?q="+encodeURIComponent(q?.value||""));list.innerHTML=j.bookings.map(b=>`<div class=card><b>${b.name}</b><div>${b.id} · ${b.phone}</div><div class=muted>${b.temple} · ${b.date} · ${b.slot}</div><h3>₹${b.total}</h3>${b.status==="PENDING_PAYMENT"?`<button onclick="pay('${b.id}')">Confirm ₹${b.total} Received & Issue Pass</button>`:`<div class=green>${b.status} · ${b.whatsapp_sent_at?"WhatsApp sent":"WhatsApp not configured/sent"}</div>`}</div>`).join("")||"<p class=muted>No matching bookings.</p>"}
async function pay(id){try{const j=await api("/api/counter/pay/"+id,{method:"POST"});alert(j.whatsapp.sent?"Pass issued and WhatsApp sent.":"Pass issued. WhatsApp: "+(j.whatsapp.reason||"not configured"));search()}catch(e){alert(e.message)}}
render();
</script></body></html>
